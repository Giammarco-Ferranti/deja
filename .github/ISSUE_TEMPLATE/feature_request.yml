name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For larger changes, please open an issue (this one) before sending a PR so we can align on direction.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do? What's frustrating about how Deja behaves today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would you like it to behave? Sketch the UX or API if helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you ruled them out.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
