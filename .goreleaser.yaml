version: 2

project_name: deja

before:
  hooks:
    - go mod tidy

builds:
  - id: deja
    main: ./cmd/deja
    binary: deja
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: darwin
        goarch: amd64
        env:
          - CC=o64-clang
          - CXX=o64-clang++
      - goos: darwin
        goarch: arm64
        env:
          - CC=oa64-clang
          - CXX=oa64-clang++
      - goos: linux
        goarch: amd64
        env:
          - CC=x86_64-linux-gnu-gcc
          - CXX=x86_64-linux-gnu-g++
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Giammarco-Ferranti
    name: deja
  draft: false
  prerelease: auto

brews:
  - name: deja
    repository:
      owner: Giammarco-Ferranti
      name: homebrew-deja
      token: '{{ .Env.TAP_GITHUB_TOKEN }}'
    directory: Formula
    homepage: https://github.com/Giammarco-Ferranti/deja
    description: Predictive inline shell autosuggestions for zsh.
    license: MIT
    install: |
      bin.install "deja"
    test: |
      system "#{bin}/deja", "--help"
    caveats: |
      To enable deja in zsh, add the following to your ~/.zshrc:

        if [[ -r "$HOME/.local/share/deja/init.zsh" ]]; then
          source "$HOME/.local/share/deja/init.zsh"
        else
          eval "$(deja init zsh)"
        fi

      Sourcing the cached script keeps deja off your shell startup path; the
      eval is only the first-run bootstrap, and deja refreshes the file itself
      when you upgrade.

      Import your existing zsh history with:

        deja import

      Upgrading? The daemon outlives shell sessions, so replace it with:

        deja daemon --restart
